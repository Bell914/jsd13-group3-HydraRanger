name: Portfolio quality gates

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/occasion_e2e
      JWT_SECRET: ci-only-secret-not-used-in-production
      SEED_USER_PASSWORD: e2e-user-password
      SEED_ADMIN_PASSWORD: e2e-admin-password
      ADMIN_EMAIL: admin@occasion.dev
      ADMIN_PASSWORD: e2e-admin-password
      CLIENT_URL: http://127.0.0.1:5173
      ADMIN_CLIENT_URL: http://127.0.0.1:5174

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            admin-client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix admin-client
      - run: npm ci --prefix server
      - run: npm test --prefix client
      - run: npm test --prefix admin-client
      - run: npm run test:security --prefix server
      - run: npm run build --prefix client
      - run: npm run build --prefix admin-client
      - run: npm run seed --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
